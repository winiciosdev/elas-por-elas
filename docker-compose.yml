services:
  postgres:
    image: postgres:16
    container_name: rede-apoio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - rede-apoio-data:/var/lib/postgresql/data

volumes:
  rede-apoio-data:
