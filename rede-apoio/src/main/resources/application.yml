spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rede-apoio
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rede_apoio}
    username: ${DB_USERNAME:rede_apoio_app}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  jwt:
    secret: ${JWT_SECRET:JDapuuh03i73KBnR+iO5HJpCwRNV0hrzSHdCzukpwko=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
